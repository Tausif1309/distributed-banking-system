spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/banking_user
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: DEBUG

auth:
  service:
    url: http://localhost:8081

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN}